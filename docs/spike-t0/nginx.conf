worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;
events { worker_connections 256; }
http {
  include mime.types;
  access_log off;
  client_body_temp_path temp/body; proxy_temp_path temp/proxy; fastcgi_temp_path temp/fcgi; uwsgi_temp_path temp/uwsgi; scgi_temp_path temp/scgi;
  server { listen 127.0.0.1:8091; server_name localhost; root C:/ruta/a/copias/base/public; index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { fastcgi_pass 127.0.0.1:9101; fastcgi_index index.php; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param SPIKE_VARIANT base; }
  }
  server { listen 127.0.0.1:8092; server_name localhost; root C:/ruta/a/copias/spike/public; index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { fastcgi_pass 127.0.0.1:9102; fastcgi_index index.php; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param SPIKE_VARIANT persist; }
  }
  server { listen 127.0.0.1:8093; server_name localhost; root C:/ruta/a/copias/spike/public; index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { fastcgi_pass 127.0.0.1:9103; fastcgi_index index.php; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param SPIKE_VARIANT init; }
  }
  server { listen 127.0.0.1:8094; server_name localhost; root C:/ruta/a/copias/spike/public; index index.php;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ { fastcgi_pass 127.0.0.1:9104; fastcgi_index index.php; include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_param SPIKE_VARIANT none; }
  }
}
